<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${book != null} ? 'Edit Book' : 'Add Book'">Book Form</title>
    <style>
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        form {
            margin-top: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, select {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
        }
        input[type="submit"] {
            width: auto;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<h1 th:text="${book != null} ? 'Edit Book' : 'Add Book'">Book Form</h1>

<form th:action="${book != null} ? @{'/books/edit/' + ${book.id}} : @{/books/add}" method="post">

    <label for="title">Title:</label>
    <input type="text" id="title" name="title" th:value="${book != null} ? ${book.title} : ''" required/>

    <label for="genre">Genre:</label>
    <input type="text" id="genre" name="genre" th:value="${book != null} ? ${book.genre} : ''" required/>

    <label for="averageRating">Average Rating:</label>
    <input type="number" id="averageRating" name="averageRating" step="0.1"
           th:value="${book != null} ? ${book.averageRating} : ''" min="0" max="10" required/>

    <label for="authorId">Author:</label>
    <select id="authorId" name="authorId" required>
        <option value="" disabled th:if="${book == null}" selected>Select an author</option>
        <option th:each="author : ${authors}"
                th:value="${author.id}"
                th:text="${author.name} + ' ' + ${author.surname}"
                th:selected="${book != null} ? ${book.author.id} == ${author.id} : false">
        </option>
    </select>

    <input type="submit" th:value="${book != null} ? 'Update Book' : 'Add Book'"/>
</form>

</body>
</html>
