<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Book Reservation - Welcome and choose a Book</title>
  <style type="text/css">
    body {
      width: 800px;
      margin: auto;
      font-family: Arial, sans-serif;
    }
    h1 {
      color: #333;
    }
    form {
      margin-top: 20px;
    }
    .book-option {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .book-option:hover {
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>
<header>
  <h1>Welcome to our Book Reservation App</h1>
</header>
<main>
  <form th:action="@{/listbooks}" method="get">
    <label>Title contains:</label>
    <input type="text" name="searchText" th:value="${searchText}" placeholder="Enter title"/>
    <br>
    <label>Minimum rating:</label>
    <input type="number" name="minRating" step="0.1" th:value="${minRating}" placeholder="e.g. 4.0"/>
    <br>
    <input type="submit" value="Search"/>
  </form>
  <form action="/bookReservation" method="post">
    <h2>Choose a book:</h2>
    <div th:each="book : ${books}">
      <input type="radio" name="bookTitle" th:value="${book.title}" required/>
      <span th:text="'Title: ' + ${book.title} + ', Genre: ' + ${book.genre} + ', Rating: ' + ${book.averageRating}"></span>
    </div>
    <h2>Enter your information:</h2>
    <label>Your Name:</label>
    <input type="text" name="readerName" required><br/>
    <label>Your Address:</label>
    <input type="text" name="readerAddress" required><br/>

    <h2>Choose number of copies:</h2>
    <input type="number" name="numberOfCopies" min="1" max="10" required><br/>
    <br/>
    <input type="submit" value="Reserve Book">
  </form>
</main>
</body>
</html>
